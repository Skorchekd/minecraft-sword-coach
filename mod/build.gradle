plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Sword Coach: a client-only Fabric mod. Build with `gradlew build` (or "Build The Mod.bat");
// the jar lands in build/libs/swordcoach-<version>.jar.

version = project.mod_version
group = project.maven_group
base { archivesName = 'swordcoach' }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// The GPL text and the copyright notice travel inside the jar.
jar {
    from(rootProject.file('../LICENSE')) { rename { 'LICENSE_swordcoach' } }
    from(rootProject.file('../COPYRIGHT.md')) { rename { 'COPYRIGHT_swordcoach.md' } }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
